<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: 'Malgun Gothic', system-ui, sans-serif;
      font-size: 14px;
      color: #1f1f1f;
      background: #fff;
      word-break: keep-all;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .version {
      margin: 0 0 16px;
      color: #777;
      font-size: 12px;
    }
    fieldset {
      margin: 0 0 16px;
      padding: 0;
      border: 0;
    }
    legend {
      margin-bottom: 8px;
      font-weight: bold;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
    }
    .hint {
      margin: 4px 0 0 24px;
      color: #777;
      font-size: 12px;
    }
    .saved {
      height: 16px;
      color: #188038;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>YouTube 광고 자동 스킵</h1>
  <p class="version" id="version"></p>

  <fieldset>
    <legend>광고 재생 속도</legend>
    <label><input type="radio" name="adSpeed" value="1"> 그대로 (1배)</label>
    <label><input type="radio" name="adSpeed" value="2"> 2배</label>
    <label><input type="radio" name="adSpeed" value="4"> 4배</label>
    <label><input type="radio" name="adSpeed" value="16"> 16배</label>
    <p class="hint">건너뛰기 버튼이 없는 광고에만 의미가 있어요.</p>
  </fieldset>

  <fieldset>
    <legend>기타</legend>
    <label><input type="checkbox" id="muteAds"> 광고 나올 때 음소거</label>
    <label><input type="checkbox" id="showDebug"> 표시에 버전과 클릭 횟수 보이기</label>
  </fieldset>

  <div class="saved" id="saved"></div>

  <script src="popup.js"></script>
</body>
</html>
